{% extends "base.html" %}
{% block title %}Login — Smartech{% endblock %}

{% block content %}
<style>
  /* ── Reset body and main for login page ── */
  body {
    overflow: auto !important;
    height: auto !important;
    min-height: 100vh !important;
  }

  body > main {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    grid-template-columns: unset !important;
    padding: 20px !important;
    height: 100vh !important;
    min-height: 100vh !important;
    overflow: auto !important;
    box-sizing: border-box !important;
  }

  .auth-wrapper {
    width: 100%;
    max-width: 820px;
    background: #faf5f0;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(100,70,100,0.12);
    display: flex;
    min-height: 480px;
    animation: authIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both;
    position: relative;
    z-index: 1;
  }

  @keyframes authIn {
    from { opacity:0; transform: scale(0.96) translateY(16px); }
    to   { opacity:1; transform: scale(1)    translateY(0); }
  }

  /* ── Left decorative panel ── */
  .auth-deco {
    width: 42%;
    background: #c9b8c8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 30px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .auth-deco::before {
    content: '';
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    top: -80px; right: -80px;
  }

  .auth-deco::after {
    content: '';
    position: absolute;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    bottom: -50px; left: -50px;
  }

  .deco-logo {
    font-size: 22px; font-weight: 800;
    color: #3d2b3c; margin-bottom: 32px;
    position: relative; z-index: 1;
    letter-spacing: -0.01em;
  }
  .deco-logo span { color: #6b68a8; }

  .deco-avatar-ring {
    position: relative; z-index: 1;
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(100,70,100,0.2);
  }
  .deco-avatar-emoji { font-size: 52px; }

  .deco-tagline {
    position: relative; z-index: 1;
    font-size: 14px; font-weight: 700;
    color: #3d2b3c; text-align: center;
    line-height: 1.4; margin-bottom: 8px;
  }

  .deco-sub {
    position: relative; z-index: 1;
    font-size: 11px; color: rgba(60,40,60,0.6);
    text-align: center; line-height: 1.6;
    max-width: 180px;
  }

  .deco-dots {
    position: relative; z-index: 1;
    display: flex; gap: 6px; margin-top: 24px;
  }
  .deco-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }
  .deco-dot.active { background: white; width: 22px; border-radius: 4px; }

  /* ── Right form panel ── */
  .auth-form-side {
    flex: 1;
    padding: 48px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .auth-title {
    font-size: 26px; font-weight: 800;
    color: #2d1f2c; letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .auth-subtitle {
    font-size: 12px; color: #a090a0;
    margin-bottom: 32px; font-weight: 400;
  }

  .input-group { margin-bottom: 14px; }

  .input-label {
    display: block; font-size: 11px;
    font-weight: 600; color: #7a607a;
    letter-spacing: 0.04em; margin-bottom: 6px;
  }

  .input-group input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e8dde8;
    border-radius: 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px; color: #2d1f2c;
    background: #ffffff; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-sizing: border-box;
  }
  .input-group input::placeholder { color: #c8b8c8; }
  .input-group input:focus {
    border-color: #928fce;
    box-shadow: 0 0 0 3px rgba(146,143,206,0.15);
  }

  /* ── Submit button — explicit type=submit, no z-index issues ── */
  .auth-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: none;
    background: #7b78b8;
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 14px rgba(123,120,184,0.35);
    position: relative;
    z-index: 10;
  }
  .auth-btn:hover {
    background: #6b68a8;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(123,120,184,0.45);
  }
  .auth-btn:active { transform: translateY(0); }

  .auth-divider {
    display: flex; align-items: center;
    gap: 12px; margin: 20px 0 16px;
    color: #d0c0d0; font-size: 11px;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: #ede0ed;
  }

  .auth-links {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 18px;
  }
  .auth-links a {
    font-size: 11px; font-weight: 500;
    color: #a090a0; text-decoration: none;
    transition: color 0.2s;
  }
  .auth-links a:hover { color: #7b78b8; }
  .auth-links .register-link {
    background: #f0e8f0; color: #7b78b8;
    padding: 6px 14px; border-radius: 20px; font-weight: 600;
  }
  .auth-links .register-link:hover { background: #e4d8f0; color: #6b68a8; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    body > main { padding: 16px !important; height: auto !important; }
    .auth-wrapper { flex-direction: column; min-height: unset; }
    .auth-deco { width: 100%; padding: 30px 20px; min-height: 180px; }
    .deco-avatar-ring { width: 70px; height: 70px; margin-bottom: 12px; }
    .deco-avatar-emoji { font-size: 32px; }
    .auth-form-side { padding: 28px 24px; }
  }
</style>

<div class="auth-wrapper">

  <!-- Left decorative side -->
  <div class="auth-deco">
    <div class="deco-logo">Smart<span>ech</span></div>
    <div class="deco-avatar-ring">
      <span class="deco-avatar-emoji">🎓</span>
    </div>
    <div class="deco-tagline">Welcome back!</div>
    <p class="deco-sub">Track your tasks, manage your courses, and stay on top of deadlines.</p>
    <div class="deco-dots">
      <div class="deco-dot active"></div>
      <div class="deco-dot"></div>
      <div class="deco-dot"></div>
    </div>
  </div>

  <!-- Right form side -->
  <div class="auth-form-side">
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Enter your credentials to continue</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="input-group">
        <label class="input-label" for="username">USERNAME</label>
        <input type="text" id="username" name="username"
               placeholder="your username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label class="input-label" for="password">PASSWORD</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-links">
      <a href="#">Forgot password?</a>
      <a href="{{ url_for('register') }}" class="register-link">Create account →</a>
    </div>
  </div>

</div>
{% endblock %}
